<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Setup Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">

<style id="css">
:root{color-scheme:dark;--bg:#14110f;--card:#1d1916;--card2:#28221d;--line:#342c26;--text:#f6f1eb;--muted:#a69b90;--acc:#f5a524;--acc2:#ffd27a;--money:#7fd99f;--blue:#9aa8ff;--danger:#ff7070;--dline:#5a2a2a;--ondanger:#1a0b0b;--hero:#3a2814;--acct:#f5a524;--boxbg:rgba(0,0,0,.12);--navbg:rgba(20,17,15,.94);--grid:#2c2621;--axis:#4a4038;--profit:#c47a08;--expense:#6f7fe0;--r:16px}
:root[data-theme=light]{color-scheme:light;--bg:#f6f3ee;--card:#ffffff;--card2:#f1ebe3;--line:#e4dbd0;--text:#1f1812;--muted:#73665a;--acc2:#a35a00;--money:#1d7f45;--blue:#3d4fc4;--danger:#c93636;--dline:#efc4c4;--ondanger:#ffffff;--hero:#ffe3b3;--acct:#a85a00;--boxbg:#faf7f2;--navbg:rgba(255,255,255,.94);--grid:#eee7de;--axis:#cfc4b7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 96px) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 8px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--acc),#e8590c);display:grid;place-items:center;color:#1a1209}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.status{font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.ok .dot{background:var(--money)}
.status.busy .dot{background:var(--acc);animation:pulse 1s infinite}
.status.err{color:var(--danger);border-color:var(--dline)}
.status.err .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.25}}
.view{display:none}
.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.vt{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 2px 12px}
.hero{background:radial-gradient(120% 140% at 100% 0%,var(--hero) 0%,var(--card) 60%);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;margin-bottom:10px}
.hero .lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;color:var(--acc2);font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--danger)}
.hero .meta{font-size:13px;color:var(--muted)}
.hero .meta b{color:var(--text);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left}
.stat .l{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:16px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.warn .v{color:var(--acc2)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.sec h3{font-size:15px;font-weight:800}
.sec button{font-size:13px;font-weight:700;color:var(--acct)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.hint{font-size:13.5px;color:var(--muted);line-height:1.5;padding:14px;border:1px dashed var(--line);border-radius:16px;text-align:center}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:40px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none;padding-bottom:2px}
.chips:empty{display:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--acc);color:#1a1209;border-color:var(--acc)}
.summary{font-size:12.5px;color:var(--muted);margin:8px 4px 0}
.summary b{color:var(--text)}
.month{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:20px 4px 8px}
.month span:last-child{color:var(--text);letter-spacing:0;font-size:13px;text-transform:none;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px 11px 11px;margin-bottom:8px;width:100%;text-align:left;transition:background .15s}
.item:active{background:var(--card2)}
.item[disabled]{cursor:default}
.cal{width:48px;flex:none;text-align:center;background:var(--card2);border-radius:12px;padding:7px 0 6px}
.cal .d{font-size:19px;font-weight:800;line-height:1}
.cal .w{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-top:4px;letter-spacing:.05em}
.cal.soon{background:rgba(154,168,255,.14)}
.cal.soon .w{color:var(--blue)}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.desc svg{vertical-align:-2px;margin-left:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--acc2);background:rgba(245,165,36,.12);border-radius:6px;padding:2px 7px;margin-right:6px}
.right{text-align:right;flex:none}
.amt{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-top:4px;white-space:nowrap}
.pill.paid{color:var(--money);background:rgba(127,217,159,.12)}
.pill.owes{color:var(--acc2);background:rgba(245,165,36,.14)}
.pill.due{color:var(--blue);background:rgba(154,168,255,.14)}
.rel{font-size:11.5px;font-weight:700;color:var(--blue)}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--acc2)}
.empty{text-align:center;padding:42px 24px;color:var(--muted);border:1px dashed var(--line);border-radius:20px;margin-top:14px}
.empty h3{color:var(--text);font-size:17px;margin:12px 0 6px}
.empty p{font-size:14px;line-height:1.5}
/* chart */
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .cap{font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}
.chart .cap b{color:var(--text)}
.ctab{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
.ctab th,.ctab td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.ctab th:first-child,.ctab td:first-child{text-align:left}
.ctab th{color:var(--muted);font-weight:700;font-size:11.5px}
.linkbtn{font-size:12.5px;font-weight:700;color:var(--acct);margin-top:6px}
/* more */
.group{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.group h3{font-size:15px;font-weight:800;margin-bottom:4px}
.group p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.btns{display:flex;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card2);border-radius:12px;padding:4px}
.seg button{border-radius:9px;padding:10px 6px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;font-weight:700;color:var(--text)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button.t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 0}
.nav button.t.on{color:var(--acct)}
.navadd{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--acc)!important;color:#1a1209!important;display:grid;place-items:center;box-shadow:0 8px 24px rgba(245,165,36,.3);margin-top:-18px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:11;max-height:92vh;overflow:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:2px auto 14px}
.sh{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh .acts{display:flex;gap:8px;align-items:center}
.x{background:var(--card2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.small{background:var(--card2);border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.field{margin-bottom:13px}
label.l,.l2{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.opt{font-weight:500}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:50px}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.money input{padding-left:28px}
.types{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.types .chip{padding:6px 11px;font-size:12.5px}
.box{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:13px;background:var(--boxbg)}
.box .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.box .bh b{font-size:14px}
.fullbtn{font-size:12.5px;font-weight:700;color:var(--acct)}
.calc{font-size:13px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.calc b{color:var(--text)}
.erow{display:grid;grid-template-columns:1fr 110px 34px;gap:6px;margin-bottom:6px;align-items:center}
.erow input{padding:11px 12px;font-size:15px}
.erow .money input{padding-left:24px}
.erow .money span{left:11px}
.rm{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.addrow{font-size:13px;font-weight:700;color:var(--acct);padding:6px 0}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card2) center/cover no-repeat}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{display:grid;place-items:center;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:11px;font-weight:700;text-align:center}
.ph.busy::after{content:"";position:absolute;inset:0;margin:auto;width:22px;height:22px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--danger);font-size:13px;font-weight:600;margin:-4px 0 10px}
.actions{display:flex;gap:8px;margin-top:4px}
.primary{flex:1;background:var(--acc)!important;color:#1a1209;border-radius:12px;padding:15px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.del{border:1px solid var(--dline)!important;color:var(--danger);border-radius:12px;padding:0 16px;font-weight:700;font-size:14px}
.del.arm{background:var(--danger)!important;color:var(--ondanger);border-color:var(--danger)!important}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
/* receipt */
.rcpt{background:#fffdf9;color:#231b14;border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:14px;border-top:8px solid var(--acc)}
.rcpt .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
.rcpt .biz{font-weight:800;font-size:18px}
.rcpt .mut{color:#7d7063;font-size:12.5px}
.rcpt .tt{text-align:right;font-weight:800;color:#c47a08;font-size:12px;letter-spacing:.12em}
.rcpt .lab{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#9a8b7c;margin:12px 0 3px}
.rcpt .ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eadfd3;font-size:14px;font-variant-numeric:tabular-nums}
.rcpt .due{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:10px}
.rcpt .pif{color:#2f8a4f}
.rcpt .ty{text-align:center;color:#7d7063;font-size:12.5px;margin-top:14px}
/* viewer */
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:30;display:none;flex-direction:column}
.viewer.open{display:flex}
.viewer .vb{display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
.viewer .vi{flex:1;display:grid;place-items:center;padding:8px;min-height:0}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.cbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;display:none;align-items:center;gap:10px;z-index:12;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cbar.show{display:flex;animation:fade .2s ease}
.cbar .t{flex:1;font-size:13.5px;font-weight:600;line-height:1.35}
.cbar .go{background:var(--acc);color:#1a1209;border-radius:10px;padding:9px 14px;font-weight:800;font-size:13.5px}
.cbar .no{color:var(--muted);font-weight:700;font-size:13px;padding:9px 4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--text);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;transition:transform .25s;z-index:40;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{transform:translate(-50%,0)}
</style>
</head>

  var receiptCache = {};

  /* ---------- CSV ---------- */
  function toCSV() {

    }));
    return rows.map(function (r) { return r.map(function (c) { c = String(c == null ? "" : c); return /[",\n\r]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(","); }).join("\r\n");

  function parseCSV(t) {
    var rows = [], r = [], c = "", q = false;
    for (var i = 0; i < t.length; i++) {
      var ch = t[i];
      if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { r.push(c); c = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; r.push(c); rows.push(r); r = []; c = ""; }
      else c += ch;
    }
    if (c !== "" || r.length) { r.push(c); rows.push(r); }
    return rows.filter(function (x) { return x.some(function (v) { return v.trim() !== ""; }); });
  }
  function normDate(s) {
    s = String(s).trim(); var m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
    if ((m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/))) { var y = +m[3]; if (y < 100) y += 2000; return y + "-" + pad(+m[1]) + "-" + pad(+m[2]); }
    var d = new Date(s); return isNaN(d) ? null : ymd(d);
  }
  function importCSV() {

      input.value = "";
      var rows = parseCSV(String(rd.result).replace(/^﻿/, ""));
      if (rows.length < 2) { toast("No rows found in that file"); return; }
      var h = rows[0].map(function (x) { return x.trim().toLowerCase(); });

      var cPr = col(/price|amount|cost|total/, /cost[s]?$|profit|balance/); if (cPr < 0) cPr = col(/amount|cost|total/);

      var added = 0, skipped = 0;
      rows.slice(1).forEach(function (r) {
        var date = normDate(r[cD] || ""), name = (r[cN] || "").trim(), price = parseMoney(r[cPr]);
        if (!date || !name || price == null) { skipped++; return; }
        var k = date + "|" + ckey(name) + "|" + r2(price).toFixed(2);
        if (seen[k]) { skipped++; return; }
        seen[k] = 1;
        var paid = cPd >= 0 ? parseMoney(r[cPd]) : null, ex = cX >= 0 ? parseMoney(r[cX]) : null;
        var ph = cPh >= 0 ? (r[cPh] || "").trim() : "";

          method: cM >= 0 ? (r[cM] || "").trim() : "", type: cT >= 0 ? (r[cT] || "").trim() : "", location: cL >= 0 ? (r[cL] || "").trim() : "",
          notes: cNo >= 0 ? (r[cNo] || "").trim() : "", expenses: ex ? [{ l: "Costs", a: r2(ex) }] : [], photos: [] });
        added++;
      });
      if (added) commit();
